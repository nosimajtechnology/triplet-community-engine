name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build the Skill package
        run: python3 scripts/build_release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        run: python3 scripts/build_release.py
      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/triplet-community-engine.zip dist/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/triplet-community-engine.zip dist/SHA256SUMS \
              --title "TripleT Community Engine ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

